name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Wait for the deployment package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..20}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.total_count' | grep -qx '[1-9][0-9]*'; then
              exit 0
            fi
            sleep 3
          done
          echo 'GitHub did not index the Pages package in time.' >&2
          exit 1
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
